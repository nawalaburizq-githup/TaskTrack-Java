
name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Docker Image
        run: docker build -t tasktrack-java .

      - name: Run Docker Container
        run: docker run -d --name tasktrack-ci -p 8080:8080 tasktrack-java

      - name: Test Application
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080/health
          curl --fail http://localhost:8080/

      - name: Stop and Remove Container
        if: always()
        run: |
          docker logs tasktrack-ci || true
          docker rm -f tasktrack-ci || true
